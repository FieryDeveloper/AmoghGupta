}

.case-side {
  padding: clamp(1.3rem, 2.4vw, 1.9rem);
  border-left: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.22);
}

.metric {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0.5rem;
  color: var(--accent);
  font: 600 clamp(2.6rem, 4.6vw, 3.7rem) / 1 var(--font-display);
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
}

.metric s {
  color: var(--dim);
  font-size: 0.62em;
  text-decoration-thickness: 2px;
  text-decoration-color: rgba(255, 255, 255, 0.3);
}

.metric-arrow {
  width: 0.4em;
  height: 0.4em;
  align-self: center;
  color: var(--dim);
  transform: rotate(45deg);
}

.metric-label {
  margin-top: -0.35rem;
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.45;
}

.case-side .metric-label {
  margin-top: 0.55rem;
}

.flow-title {
  margin: 1.7rem 0 0.9rem;
  color: var(--dim);
  font: 0.7rem/1.4 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.flow {
  position: relative;
  display: grid;
  gap: 0.95rem;
}

.flow::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 0.6rem;
  bottom: 0.6rem;
  width: 1px;
  background-image: linear-gradient(var(--accent-line) 50%, transparent 50%);
  background-size: 1px 8px;
  animation: flow 1s linear infinite;
}

@keyframes flow {
  to {
    background-position: 0 8px;
  }
}

.flow li {
  position: relative;
  display: grid;
  padding-left: 1.5rem;
  line-height: 1.35;
}

.flow li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.38rem;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--bg-raised);
  border: 1px solid var(--line-strong);
}

.flow li:last-child::before {
  background: var(--accent);
  border-color: var(--accent);
}

.flow strong {
  font: 500 0.84rem/1.4 var(--font-mono);
}

.flow span {
  color: var(--dim);
  font-size: 0.8rem;
}

/* Research ---------------------------------------------------------------- */

.papers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.paper {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: clamp(1.3rem, 2.4vw, 1.9rem);
}

.paper h3 {
  font: 600 1.18rem/1.28 var(--font-display);
  letter-spacing: -0.02em;
}

.paper-figure {
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 8;
  margin-bottom: 0.4rem;
  padding: 0.75rem;
  border-radius: var(--radius-sm);
  background: #fff;
  overflow: hidden;
}

.paper-figure img {
  max-height: 100%;
  width: auto;
  object-fit: contain;
  transition: transform 0.5s var(--ease);
}

.paper-figure:hover img {
  transform: scale(1.03);
}

.venue {
  color: var(--accent);
  font: 500 0.74rem/1.4 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.authors {
  color: var(--dim);
  font-size: 0.86rem;
}

.paper-links {
  display: flex;
  gap: 0.5rem;
  margin-top: auto;
  padding-top: 0.5rem;
}

.toolkit {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-block: 1px solid var(--line);
}

.toolkit > div {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 1.4rem 1.5rem 1.5rem 0;
}

.toolkit > div + div {
  padding-left: 1.5rem;
  border-left: 1px solid var(--line);
}

.toolkit h4 {
  font: 600 1.25rem/1.2 var(--font-display);
  letter-spacing: -0.02em;
}

.toolkit p {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.5;
}

.toolkit .tags {
  margin-top: auto;
  padding-top: 0.4rem;
}

/* Row lists --------------------------------------------------------------- */

.rows {
  border-top: 1px solid var(--line);
}

.row {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 1.5rem;
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
}

.row-meta {
  padding-top: 0.2rem;
  color: var(--dim);
  font: 0.74rem/1.5 var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.row-main {
  font-weight: 500;
  line-height: 1.45;
}

.row-main small {
  display: block;
  margin-top: 0.2rem;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 400;
  line-height: 1.5;
}

.duo {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
  gap: clamp(28px, 4vw, 56px);
}

.duo .row {
  grid-template-columns: minmax(0, 1fr);
  gap: 0.25rem;
}

/* Log --------------------------------------------------------------------- */

.log {
  border-top: 1px solid var(--line);
}

.log li {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 1.5rem;
  align-items: baseline;
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
}

.log time {
  color: var(--dim);
  font: 0.74rem/1.6 var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.log li:first-child time {
  color: var(--accent);
}

.log-text {
  color: var(--muted);
}

.log img.emoji {
  display: inline;
  height: 1em;
  width: 1em;
  vertical-align: -0.1em;
}

/* Contact + footer -------------------------------------------------------- */

.contact-panel {
  padding: clamp(2rem, 6vw, 4.5rem);
  border: 1px solid var(--line-strong);
  border-radius: calc(var(--radius) + 8px);
  background: radial-gradient(50% 120% at 100% 0%, rgba(185, 255, 102, 0.12), transparent 60%), var(--bg-raised);
}

.contact-panel h2 {
  margin-top: 1.3rem;
  font-size: clamp(2.4rem, 6.4vw, 4.8rem);
}

.contact-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem;
  margin-top: 2rem;
}

.contact-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0 1.4rem;
  margin-top: 1.4rem;
  font: 0.82rem/1.6 var(--font-mono);
}

.contact-links a {
  display: inline-flex;
  align-items: center;
  min-width: 44px;
  min-height: 44px;
  color: var(--muted);
  transition: color 0.2s;
}

.contact-links a:hover {
  color: var(--accent);
}

.footer {
  margin-top: clamp(48px, 8vh, 88px);
  padding: 1.6rem 0 2.2rem;
  border-top: 1px solid var(--line);
  color: var(--dim);
  font: 0.76rem/1.6 var(--font-mono);
}

.footer-inner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
}

.footer-inner {
  align-items: center;
}

.footer a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}

.footer a:hover {
  color: var(--accent);
}

/* Standalone message pages (404) ------------------------------------------ */

.notice {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-content: center;
  justify-items: start;
  gap: 1.2rem;
  width: min(640px, 100% - 48px);
  margin-inline: auto;
}

.notice-code {
  color: var(--accent);
  font: 400 italic clamp(6rem, 24vw, 12rem) / 0.9 var(--font-serif);
  letter-spacing: -0.04em;
}

.notice p {
  color: var(--muted);
}

/* Scroll reveal (only when JS is running) --------------------------------- */

.js [data-reveal] {
  opacity: 0;
  transform: translateY(18px);
  transition:
    opacity 0.8s var(--ease),
    transform 0.8s var(--ease);
  transition-delay: var(--delay, 0ms);
}

.js [data-reveal].is-in {
  opacity: 1;
  transform: none;
}

/* Responsive -------------------------------------------------------------- */

@media (max-width: 1000px) {
  .hero-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .plot {
    justify-self: start;
    width: min(100%, 420px);
  }

  .split {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.4rem;
  }

  .rail {
    position: static;
  }

  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stat:nth-child(n + 3) {
    margin-top: 1.5rem;
    border-top: 1px solid var(--line);
  }
}

@media (max-width: 820px) {
  .nav-toggle {
    display: block;
  }

  .nav-cta {
    display: none;
  }

  .nav-links {
    position: absolute;
    inset: var(--nav-h) 0 auto 0;
    flex-direction: column;
    gap: 0;
    margin: 0;
    padding: 0.5rem clamp(20px, 4vw, 48px) 1.2rem;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition:
      opacity 0.25s,
      transform 0.25s var(--ease),
      visibility 0.25s;
  }

  .nav.is-open .nav-links {
    opacity: 1;
    visibility: visible;
    transform: none;
  }

  .nav-links a {
    padding: 0.9rem 0.25rem;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    font-size: 1.05rem;
  }

  .nav-links a:hover,
  .nav-links a.is-active {
    background: none;
    color: var(--accent);
  }

  .case-grid,
  .case-pair,
  .papers,
  .toolkit,
  .duo {
    grid-template-columns: minmax(0, 1fr);
  }

  .case-side {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .toolkit > div,
  .toolkit > div + div {
    padding: 1.3rem 0;
    border-left: 0;
  }

  .toolkit > div + div {
    border-top: 1px solid var(--line);
  }

  .row,
  .log li {
    grid-template-columns: minmax(0, 1fr);
    gap: 0.25rem;
  }
}

@media (max-width: 560px) {
  .ident {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
  }

  .status {
    grid-column: 1 / -1;
    justify-self: start;
    margin-left: 0;
  }

  .case-head {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .case-when {
    grid-column: 1 / -1;
    text-align: left;
    white-space: normal;
  }

  .case-when small {
    display: inline;
  }

  .case-when small::before {
    content: " · ";
  }

  .contact-actions .btn {
    flex: 1 1 auto;
  }

  .plot figcaption {
    padding-left: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }

  .js [data-reveal] {
    opacity: 1;
    transform: none;
  }

  .plot-runner {
    display: none;
  }
}
