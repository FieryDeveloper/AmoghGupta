    Publications:
      - title: "SHARD: Safe and Helpful Alignment via Self-Reframing Distillation"
        authors:
          - Amogh Gupta
        publisher: EMNLP 2026 Findings
        releaseDate: 2026
        summary: >
          Large language models often struggle with sensitive prompts — refusing outright, providing generic
          safety boilerplate, or failing to address legitimate informational needs that can be answered safely.
          SHARD is a self-reframing distillation method to improve safe-helpfulness.

      - title: "Compounding Disadvantage: Auditing Intersectional Bias in LLM-Generated Explanations Across Indian and American STEM Education"
        authors:
          - Amogh Gupta
        publisher: ACM Conference on Fairness, Accountability, and Transparency (FAccT) 2026
        releaseDate: 2026
        summary: >
          Audits intersectional bias in AI-generated explanations across Indian and American STEM educational
          contexts, showing how disadvantages compound across language, caste, and social context rather than
          simply adding up.

