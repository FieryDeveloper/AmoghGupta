research:
  heading_lead: Alignment research at UNC.
  heading_accent: Safe, without being useless.
  lede: >
    I'm a graduate researcher in NLP at UNC Chapel Hill, advised by
    <a href="https://sites.google.com/site/snigdhac/">Prof. Snigdha Chaturvedi</a>. Aligned models often refuse
    requests they could have answered safely. I work on methods that win that helpfulness back, and I build the
    training and evaluation pipelines that show whether they do.

  papers:
    - venue: EMNLP 2026 Findings
      title: "SHARD: Safe and Helpful Alignment via Self-Reframing Distillation"
      summary: >
        Aligned models over-refuse: they decline a sensitive prompt, or answer with safety boilerplate, when the
        underlying need could have been met safely. SHARD uses self-reframing distillation to win that helpfulness
        back without weakening safety.
      authors: "V. Manoranjan, <strong>Amogh Gupta</strong>, A. R. Vijjini, T. Hofweber, S. Chaturvedi"
      figure: shard
      figure_alt: "SHARD pipeline: an unhelpful refusal is reframed with philosophical guidelines, distilled, and yields a safe and helpful answer"
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2606.15517
    - venue: ACM FAccT 2026
      title: "Compounding Disadvantage: Auditing Intersectional Bias in LLM-Generated Explanations Across Indian and American STEM Education"
      summary: >
        An audit of AI-generated explanations in Indian and American STEM settings. Bias across language, caste and
        social context does not simply add up. It compounds.
      authors: "<strong>Amogh Gupta</strong>, N. R. Patil, S. Ghosh, S. N. S. Gaikwad"
      figure: compounding
      figure_alt: "Audit design from the Compounding Disadvantage paper: student identities and tasks are sent to several LLMs and the outputs measured for bias"
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2601.14506

  # The research and engineering mix.
  toolkit_title: The research and engineering mix
  toolkit:
    - name: Train
      note: Post-training methods for alignment.
      items: ["Distillation", "SFT", "RLHF", "DPO", "LoRA / QLoRA"]
    - name: Evaluate
      note: Knowing what a result actually licenses you to claim.
      items: ["Red-teaming", "Bias audits", "LLM evaluation", "Interpretability"]
    - name: Scale
      note: The engineering that makes the experiments run.
      items: ["PyTorch", "Transformers", "vLLM", "Distributed training", "AWS"]

  labs:
    - meta: Now · UNC NLP
      title: Chaturvedi Lab
      note: LLM alignment and safe-helpfulness with Prof. Snigdha Chaturvedi.
    - meta: Earlier · UNC
      title: Society-Centered AI Lab
      note: Responsible AI and bias auditing with Dr. Neil Gaikwad.
    - meta: 2024 · IIT Kharagpur
      title: Red-teaming and multilingual jailbreaks
      note: Evaluated jailbreak robustness across ChatGPT, Gemini, Nous-Hermes, Mixtral Instruct and Cohere Coral.
    - meta: 2024 · IIT Indore
      title: Disaster-tweet summarization
      note: LLMs and integer linear programming to cut 3,000 tweets down to the 40 that matter.

  earlier_papers:
    - meta: IEEE INDISCON 2024
      title: YOLOv8 Based Detection of Fall Armyworm in Field Crops
      note: "P. Mhala, <strong>Amogh Gupta</strong>, S. Sharma"
    - meta: ICIT 2024
      title: "Automated Animal Intrusion Detection: A Deep Learning Approach"
      note: "<strong>Amogh Gupta</strong>, S. Sharma, M. Mangal"
    - meta: Preprint 2024
      title: "Traffic Sign Sensing: A Deep Learning Approach for Enhanced Road Safety"
      note: "<strong>Amogh Gupta</strong>, P. Mhala, M. Mangal, K. Yadav, S. Sharma"
      url: https://www.researchsquare.com/article/rs-3889986/v1

