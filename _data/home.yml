work:
  heading_lead: Shipped at Amazon, Nomura, EY
  heading_accent: and an AI startup.
  lede: >
    Four teams, four very different definitions of "working". Shipping to each one is where my standards
    for evaluation come from.

  # Full-width case studies.
  featured:
    - id: amazon
      company: Amazon
      logo: amazon.png
      role: Software Development Engineer Intern · Alexa Audio
      dates: May – Aug 2026
      location: Seattle, WA
      title: "A3LS: accent regression testing for Alexa"
      body: >
        Speech recognition degrades unevenly across accents, and a regression there stays invisible unless you
        test for it. A3LS generates 5,000+ audio files on the fly across multiple accents for Alexa regression
        testing, then scores how far recognition drops for each one.
      points:
        - A Step Functions pipeline fans synthesis and scoring out across every utterance and accent, reporting per-accent WER and AIER.
        - A React/Cloudscape dashboard over a CloudWatch metrics API surfaces per-accent accuracy, latency percentiles and GPU concurrency.
        - Wrote the HLD/LLD design docs and drove cross-team reviews to add an accent dimension to production ASR test runs.
        - 80+ code reviews across four packages (Smithy, Java, CDK, React), owning CI/CD end to end.
      metric: 5K+
      metric_label: audio files synthesized on the fly, across accents, for Alexa regression testing
      flow_title: How a run works
      flow:
        - label: Utterances
          note: test inputs
        - label: Text to speech
          note: across multiple accents
        - label: ASR
          note: transcribes each file
        - label: WER / AIER
          note: scored per accent
        - label: Dashboard
          note: per-accent results
      tags: ["Java", "AWS Step Functions", "Lambda", "Smithy", "CDK", "React", "CloudWatch"]

    - id: aiassistant
      company: AIAssistant
      logo: aiassistant.jpg
      url: https://aiassistant.co/
      role: Founding Engineer · Voice and agentic AI startup
      dates: Aug – Dec 2024
      location: California · Remote
      title: Voice agents, from first call to client demo
      body: >
        Founding engineer at an early-stage startup building voice and agentic AI for its clients. I built the
        services behind the calls and turned ideas into working prototypes the team could put in front of customers.
      points:
        - Prototyped call summarization, healthcare assistants and lead-generation voice systems for client demos.
        - Built the integrations across Twilio, Deepgram and ElevenLabs that carry a call from audio to answer.
        - Shipped FastAPI backends in Python for multiple clients.
      metric: "3"
      metric_label: "voice systems prototyped for client demos: call summarization, healthcare assistants, lead generation"
      flow_title: The loop behind a call
      flow:
        - label: Phone call
          note: Twilio
        - label: Speech to text
          note: Deepgram
        - label: Agent logic
          note: FastAPI backend
        - label: Text to speech
          note: ElevenLabs
      tags: ["FastAPI", "Python", "Twilio", "Deepgram", "ElevenLabs"]

