        Engineering on an internal budgeting and financial planning application used by multiple teams.
      points:
        - Delivered features end to end, with React on the frontend and Spring Boot services behind it.
        - Focused on performance, bug fixes and user experience.
        - Worked in an Agile team with Jenkins CI/CD and SQL at the data layer.
